<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <title>我的第一张地图</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10.11.0/ol.css" />
    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            height: 100%;
        }

        #map {
            width: 100%;
            height: 100%;
            background: #e5e7eb;
        }

        #tip {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 10;
            padding: 8px 14px;
            border-radius: 6px;
            background: rgba(15, 23, 42, 0.85);
            color: #e2e8f0;
            font-family: "Microsoft YaHei", sans-serif;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div id="map"></div>
    <div id="tip">滚轮缩放 · 按住拖动</div>

    <script src="https://cdn.jsdelivr.net/npm/ol@10.11.0/dist/ol.js"></script>
    <script>
        const map = new ol.Map({
            target: "map",
            layers: [
                new ol.layer.Tile({
                    source: new ol.source.XYZ({
                        url: "https://services.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
                        maxZoom: 19,
                        attributions: "Tiles © Esri"
                    })
                })
            ],
            view: new ol.View({
                center: ol.proj.fromLonLat([116.397, 39.909]),
                zoom: 12
            })
        });
    </script>
</body>

</html>
